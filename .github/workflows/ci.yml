name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --group dev
      - name: Pytest
        run: uv run pytest -q
      - name: Offline runtime tests
        run: |
          uv run python scripts/smoke_agent.py
          uv run python scripts/smoke_subagent.py
