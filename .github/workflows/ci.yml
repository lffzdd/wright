name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --group dev
      - name: Lint
        run: uv run ruff check src
      - name: Pytest
        run: uv run pytest -q
      - name: Offline runtime tests
        run: |
          uv run python scripts/smoke_agent.py
          uv run python scripts/smoke_subagent.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm ci
        working-directory: web
      - name: Unit tests
        run: npm run test
        working-directory: web
      - name: Build
        run: npm run build
        working-directory: web
      - name: Verify committed assets are up to date
        run: git diff --exit-code -- src/wright/web/static
