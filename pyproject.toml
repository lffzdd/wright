[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wright"
version = "0.1.0"
description = "A coding agent for the terminal."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Liu Feifan" }]
keywords = ["agent", "llm", "coding-agent", "cli"]
dependencies = [
    "openai>=2.29.0",
    "python-dotenv>=1.0.0",
    "mcp>=1.28.0,<2",
    "jsonschema>=4.26.0",
    "prompt-toolkit>=3.0.53",
    "pydantic>=2.0",
    "rich>=13.0",
    "httpx>=0.27",
    "textual>=8.2.8",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
wright = "wright.main:main"

[project.urls]
Homepage = "https://github.com/lffzdd/wright"
Repository = "https://github.com/lffzdd/wright"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/wright"]
exclude = ["src/wright/tests"]

[tool.hatch.build.targets.wheel.force-include]
"src/wright/permission/permission_settings.json" = "wright/permission/permission_settings.json"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/wright/tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
# 只开能 --fix、或改完确实更干净的规则。不选 ALL。
# 故意不选：BLE（except Exception）、S（bandit / S110 except-pass）、
# SIM105（改成 suppress(Exception)，还是同一件事）。
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade（removesuffix、collections.abc、…）
    "B",      # bugbear（zip(strict=)、raise from）
    "C4",     # comprehensions
    "PIE",    # flake8-pie
    "FLY",    # f-string
    "ISC",    # implicit string concat
    "FURB",   # refurb
    "RUF",    # ruff 自己的（含 __all__ 排序）
    "TRY004", # isinstance 失败该 TypeError
]
ignore = [
    "E501",   # 中文 prompt / 长字符串，不靠 lint 断行
    "E741",   # 单字母变量名，测试里常见，不是 bug
    "B027",   # Renderer 可选 hook 用 `...`，不是该变成 abstractmethod
    "RUF001", # 中文标点被当成 ambiguous unicode
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["wright"]
